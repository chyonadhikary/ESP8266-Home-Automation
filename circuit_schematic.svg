<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#182235} .box{fill:#eef4ff;stroke:#243b6b;stroke-width:3} .relay{fill:#fff4df;stroke:#9a6500;stroke-width:3} .btn{fill:#eafff4;stroke:#19724d;stroke-width:3} .wire{fill:none;stroke:#1877c9;stroke-width:4} .gnd{fill:none;stroke:#555;stroke-width:4} .power{fill:none;stroke:#c62828;stroke-width:4} .label{font-size:21px} .small{font-size:17px} .title{font-size:30px;font-weight:bold}</style>
<text x="50" y="50" class="title">SMART HOME ESP8266 — ELECTRICAL PIN-TO-WIRE SCHEMATIC</text>
<text x="50" y="82" class="small">Relay logic: active LOW (GPIO LOW = relay ON). Buttons use INPUT_PULLUP (pressed = GPIO LOW).</text>
<rect x="70" y="150" width="360" height="560" rx="12" class="box"/><text x="125" y="190" class="title">NodeMCU ESP8266</text><text x="115" y="225" class="small">USB / 5 V regulated input</text>
<text x="100" y="280" class="label">D1 / GPIO5</text><text x="100" y="345" class="label">D2 / GPIO4</text><text x="100" y="410" class="label">D5 / GPIO14</text><text x="100" y="475" class="label">D6 / GPIO12</text>
<text x="100" y="555" class="label">D3 / GPIO0</text><text x="100" y="600" class="label">D4 / GPIO2</text><text x="100" y="645" class="label">D7 / GPIO13</text><text x="100" y="690" class="label">D8 / GPIO15</text>
<text x="305" y="280" class="small">RELAY1</text><text x="305" y="345" class="small">RELAY2</text><text x="305" y="410" class="small">RELAY3</text><text x="305" y="475" class="small">RELAY4</text>
<rect x="600" y="150" width="390" height="560" rx="12" class="relay"/><text x="675" y="195" class="title">4-Channel Relay</text><text x="665" y="225" class="small">Use a module with common GND</text>
<text x="630" y="285" class="label">IN1 — Main Light</text><text x="630" y="350" class="label">IN2 — LED Light</text><text x="630" y="415" class="label">IN3 — Fan</text><text x="630" y="480" class="label">IN4 — Socket</text><text x="630" y="560" class="label">VCC — module supply</text><text x="630" y="620" class="label">GND — common ground</text>
<rect x="1160" y="145" width="360" height="390" rx="12" class="btn"/><text x="1225" y="190" class="title">Momentary Buttons</text><text x="1210" y="230" class="small">Other side of every button → GND</text><text x="1210" y="285" class="label">S1 Main Light</text><text x="1210" y="345" class="label">S2 LED Light</text><text x="1210" y="405" class="label">S3 Fan</text><text x="1210" y="465" class="label">S4 Socket</text>
<rect x="1160" y="620" width="360" height="170" rx="12" fill="#f7e8e8" stroke="#a82121" stroke-width="3"/><text x="1210" y="665" class="title">Load contacts</text><text x="1200" y="710" class="small">COM/NO to qualified mains wiring</text><text x="1200" y="745" class="small">Do not build mains on breadboard.</text>
<!-- relay wires -->
<path d="M430 275 H600" class="wire"/><path d="M430 340 H600" class="wire"/><path d="M430 405 H600" class="wire"/><path d="M430 470 H600" class="wire"/>
<!-- buttons wires -->
<path d="M430 550 H1050 V280 H1160" class="wire"/><path d="M430 595 H1020 V340 H1160" class="wire"/><path d="M430 640 H990 V400 H1160" class="wire"/><path d="M430 685 H960 V460 H1160" class="wire"/>
<!-- power -->
<path d="M250 120 V150" class="power"/><text x="105" y="115" class="label" fill="#c62828">5 V regulated</text><path d="M430 605 H520 V620 H600" class="gnd"/><text x="470" y="650" class="small">GND</text><path d="M990 620 H1090 V820 H520 V620" class="gnd"/><text x="1010" y="850" class="small">Common GND return</text>
<!-- load arrows -->
<path d="M990 280 H1090 V700 H1160" class="power"/><path d="M990 345 H1090 V720 H1160" class="power"/><path d="M990 410 H1090 V740 H1160" class="power"/><path d="M990 475 H1090 V760 H1160" class="power"/>
<text x="55" y="925" class="small">Safety: relay contact ratings, isolation, fusing, enclosure, earthing, creepage/clearance and local electrical code must be verified before connecting 110/220 V.</text>
</svg>
